# Builds the site in this (private) repo and pushes only the static build (out/)
# to a separate public repo that GitHub Pages serves. Source code never leaves this repo.
#
# One-time setup: see "Deploying" in README.md (public repo + PAGES_TOKEN secret).
name: Deploy site to public Pages repo

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # The public repo that hosts the site. "<user>.github.io" serves at https://<user>.github.io/,
  # any other name serves at https://<user>.github.io/<name>/.
  PAGES_REPO: zeus11011/zeus11011.github.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Build
        run: |
          name="${PAGES_REPO#*/}"
          # user site (<user>.github.io) lives at the domain root; project sites under /<name>
          if [[ "$name" == *.github.io ]]; then base=""; else base="/$name"; fi
          NEXT_PUBLIC_BASE_PATH="$base" npx next build
      - name: Push build to the public repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_TOKEN }}
          external_repository: ${{ env.PAGES_REPO }}
          publish_branch: gh-pages
          publish_dir: ./out
          # adds .nojekyll by default, so Pages serves the _next/ folder
          commit_message: "deploy ${{ github.sha }}"
